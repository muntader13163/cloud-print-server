<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيرفر الطباعة السحابي | Cloud Print</title>
    <style>
        :root {
            --primary: #0078d4;
            --primary-hover: #106ebe;
            --bg: #f3f3f3;
            --card-bg: #ffffff;
            --text: #242424;
            --border: #e0e0e0;
            --success: #107c41;
            --danger: #d13438;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0 0 8px 0;
            color: var(--primary);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-online { background-color: #dff6dd; color: var(--success); }
        .status-offline { background-color: #fde8e8; color: var(--danger); }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        select, input[type="file"], input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: #fafafa;
        }

        .btn-print {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-print:hover { background-color: var(--primary-hover); }
        .btn-print:disabled { background-color: #ccc; cursor: not-allowed; }

        .alert {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }
        .alert-success { background-color: #dff6dd; color: var(--success); border: 1px solid #b7eb8f; }
        .alert-error { background-color: #fde8e8; color: var(--danger); border: 1px solid #ffa39e; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🖨️ سيرفر الطباعة السحابي</h2>
        <div id="agentStatus" class="status-badge status-offline">جاري التحقق من اتصال الحاسوب...</div>
    </div>

    <form id="printForm">
        <!-- 1. اسم الطابعة (أو اختيارها) -->
        <div class="form-group">
            <label for="printerName">اسم الطابعة المستهدفة (كما هي معرفة بالحاسوب):</label>
            <input type="text" id="printerName" placeholder="مثال: HP LaserJet 1020" required>
        </div>

        <!-- 2. رفع الملف -->
        <div class="form-group">
            <label for="fileInput">اختر المستند أو الصورة (PDF / Image):</label>
            <input type="file" id="fileInput" accept="application/pdf,image/*" required>
        </div>

        <!-- 3. عدد النسخ -->
        <div class="form-group">
            <label for="copiesInput">عدد النسخ:</label>
            <input type="number" id="copiesInput" value="1" min="1" max="50" required>
        </div>

        <!-- زر الإرسال -->
        <button type="submit" id="submitBtn" class="btn-print">طباعة الآن</button>
    </form>

    <div id="alertBox" class="alert"></div>
</div>

<script>
    const agentStatus = document.getElementById('agentStatus');
    const printerNameInput = document.getElementById('printerName');
    const fileInput = document.getElementById('fileInput');
    const copiesInput = document.getElementById('copiesInput');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');

    // التحقق الدوري من حالة الطابعات المتصلة (Agent)
    async function checkAgentStatus() {
        try {
            const response = await fetch('/api/printers');
            const data = await response.json();
            
            if (data.printers && data.printers.length > 0) {
                agentStatus.textContent = '● الحاسوب متصل وجاهز للطباعة';
                agentStatus.className = 'status-badge status-online';
            } else {
                agentStatus.textContent = '○ بانتظار اتصال الوسيط المحلي (agent.py)';
                agentStatus.className = 'status-badge status-offline';
            }
        } catch (e) {
            agentStatus.textContent = '○ خطأ في الاتصال بالسيرفر';
            agentStatus.className = 'status-badge status-offline';
        }
    }

    // فحص الحالة عند فتح الصفحة وكل 5 ثوانٍ
    checkAgentStatus();
    setInterval(checkAgentStatus, 5000);

    // إرسال أمر الطباعة
    document.getElementById('printForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const file = fileInput.files[0];
        if (!file) return;

        showAlert('جاري تجهيز الملف ورفع المهمة...', 'success');
        submitBtn.disabled = true;

        // تحويل الملف إلى Base64 أو رابط مؤقت ليتم سحبه من الوسيط
        const reader = new FileReader();
        reader.onload = async function(evt) {
            const jobData = {
                printerName: printerNameInput.value,
                fileName: file.name,
                fileUrl: evt.target.result, // إرسال الملف بصيغة Data URL ليقوم الوسيط بتنزيله وطباعته
                copies: copiesInput.value
            };

            try {
                const response = await fetch('/api/print', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jobData)
                });

                const result = await response.json();
                if (response.ok) {
                    showAlert('تم إرسال أمر الطباعة بنجاح إلى حاسوبك المحلي!', 'success');
                    fileInput.value = '';
                } else {
                    showAlert('حدث خطأ أثناء الإرسال: ' + (result.message || 'غير معروف'), 'error');
                }
            } catch (err) {
                showAlert('فشل الاتصال بالسيرفر السحابي: ' + err.message, 'error');
            } finally {
                submitBtn.disabled = false;
            }
        };

        reader.readAsDataURL(file);
    });

    function showAlert(msg, type) {
        alertBox.textContent = msg;
        alertBox.className

<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيرفر الطباعة السحابي - Cloud Print Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        darkbg: '#0f172a',
                        darkcard: '#1e293b'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkbg text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 p-3 sm:p-6">

    <!-- Header / Nav -->
    <header class="max-w-7xl mx-auto bg-white dark:bg-darkcard rounded-2xl shadow-sm p-4 mb-4 sm:mb-6 border border-slate-200 dark:border-slate-800 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-3">
            <div class="bg-brand-600 text-white p-2.5 rounded-xl shadow-md">
                <i class="fa-solid fa-print text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-base sm:text-lg">سيرفر الطباعة السحابي</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">إرسال المهام وطباعتها صامتاً في الخلفية</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-100 dark:border-slate-800">
            <div id="agentStatus" class="flex items-center gap-2 bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 px-3 py-1.5 rounded-full text-xs font-semibold border border-amber-200 dark:border-amber-800">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span>بانتظار الاتصال...</span>
            </div>
            
            <div class="flex items-center gap-2">
                <a href="/server.html" class="text-xs bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl transition flex items-center gap-1.5 font-semibold">
                    <i class="fa-solid fa-server text-brand-500"></i>
                    <span class="hidden sm:inline">لوحة السيرفر</span>
                </a>
                <button onclick="toggleDarkMode()" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-slate-600 dark:text-slate-300 hover:text-brand-500 transition">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">
        
        <!-- Panel 1: Print Dialog Form -->
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-4 sm:p-6 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100 dark:border-slate-800">
                    <h2 class="font-bold text-sm sm:text-base flex items-center gap-2 text-slate-700 dark:text-slate-200">
                        <i class="fa-brands fa-windows text-brand-500"></i> نافذة طباعة ويندوز (Windows Print)
                    </h2>
                </div>

                <form id="printForm" class="space-y-4">
                    <!-- File Upload Area -->
                    <div>
                        <label class="block text-xs font-bold mb-1 text-slate-600 dark:text-slate-300">اختر الملف المراد طباعته (PDF / صورة):</label>
                        <label class="flex flex-col items-center justify-center w-full h-32 sm:h-36 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl cursor-pointer bg-slate-50 dark:bg-slate-900/50 hover:bg-slate-100 dark:hover:bg-slate-900 transition p-4">
                            <div class="flex flex-col items-center justify-center text-center">
                                <i class="fa-solid fa-cloud-arrow-up text-3xl text-brand-500 mb-2"></i>
                                <p id="uploadLabel" class="text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-300">انقر لرفع ملف PDF أو صورة من جهازك</p>
                                <p class="text-[10px] text-slate-400 mt-1">PDF, PNG, JPG, JPEG (حد أقصى 25MB)</p>
                            </div>
                            <input type="file" id="fileInput" class="hidden" accept="application/pdf,image/*" required />
                        </label>
                    </div>

                    <!-- Target Printer Selection -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs font-bold text-slate-600 dark:text-slate-300">الطابعة المستهدفة:</label>
                            <div class="flex gap-2">
                                <button type="button" onclick="setDefaultPrinter()" class="text-[11px] text-emerald-600 dark:text-emerald-400 hover:underline flex items-center gap-1 font-semibold">
                                    <i class="fa-solid fa-check-to-slot"></i> جعلها افتراضية
                                </button>
                                <button type="button" onclick="fetchPrinters()" class="text-[11px] text-brand-500 hover:underline flex items-center gap-1">
                                    <i class="fa-solid fa-rotate"></i> تحديث
                                </button>
                            </div>
                        </div>
                        <select id="printerSelect" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs sm:text-sm text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-brand-500 outline-none" required disabled>
                            <option value="">-- بانتظار اتصال الحاسوب المحلي --</option>
                        </select>
                    </div>

                    <!-- Print Options Grid -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold mb-1 text-slate-600 dark:text-slate-300">عدد النسخ:</label>
                            <input type="number" id="copiesInput" value="1" min="1" max="99" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs sm:text-sm text-center" required />
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 text-slate-600 dark:text-slate-300">اتجاه الصفحة:</label>
                            <select id="orientationSelect" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs sm:text-sm">
                                <option value="portrait">عمودي (Portrait)</option>
                                <option value="landscape">أفقي (Landscape)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold mb-1 text-slate-600 dark:text-slate-300">نمط الألوان:</label>
                            <select id="colorSelect" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs sm:text-sm">
                                <option value="color">ملون (Color)</option>
                                <option value="grayscale">أبيض وأسود (Mono)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 text-slate-600 dark:text-slate-300">حجم الورق:</label>
                            <select id="paperSize" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs sm:text-sm">
                                <option value="A4">A4 (210 x 297 mm)</option>
                                <option value="A3">A3 (297 x 420 mm)</option>
                                <option value="Letter">Letter</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>

            <div class="mt-6">
                <div id="alertBox" class="mb-3 p-3 text-xs rounded-xl hidden text-center font-semibold"></div>
                <button type="button" id="submitBtn" onclick="sendPrintJob()" disabled class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-brand-500/20 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-sm sm:text-base">
                    <i class="fa-solid fa-paper-plane"></i> إرسال للطباعة عبر السحاب
                </button>
            </div>
        </div>

        <!-- Panel 2: Live Preview Panel -->
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-4 sm:p-6 flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100 dark:border-slate-800">
                <h2 class="font-bold text-sm sm:text-base flex items-center gap-2 text-slate-700 dark:text-slate-200">
                    <i class="fa-regular fa-eye text-brand-500"></i> معاينة المخرجات المباشرة (Live Preview)
                </h2>
                <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-lg text-xs">
                    <button onclick="zoomPreview(0.1)" class="hover:text-brand-500"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                    <span id="zoomLevel">100%</span>
                    <button onclick="zoomPreview(-0.1)" class="hover:text-brand-500"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                </div>
            </div>

            <div id="previewContainer" class="flex-1 min-h-[300px] sm:min-h-[400px] bg-slate-50 dark:bg-slate-900/50 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-xl flex flex-col items-center justify-center relative overflow-hidden p-2 sm:p-4">
                <div class="text-center text-slate-400">
                    <i class="fa-regular fa-file-pdf text-4xl mb-2"></i>
                    <p class="text-xs sm:text-sm">الرجاء اختيار ملف لعرض المعاينة هنا</p>
                </div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center text-xs text-slate-500 dark:text-slate-400">
                <span id="fileStatusText">جاهز للطباعة: لم يتم اختيار ملف بعد.</span>
                <span id="fileSizeText">0.0 MB</span>
            </div>
        </div>

    </main>

<script>
    const agentStatus = document.getElementById('agentStatus');
    const printerSelect = document.getElementById('printerSelect');
    const fileInput = document.getElementById('fileInput');
    const copiesInput = document.getElementById('copiesInput');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const previewContainer = document.getElementById('previewContainer');
    const fileStatusText = document.getElementById('fileStatusText');
    const fileSizeText = document.getElementById('fileSizeText');
    const uploadLabel = document.getElementById('uploadLabel');

    let fileBase64Data = "";
    let currentZoom = 1;

    // Dark Mode Controller
    function toggleDarkMode() {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-moon';
    }

    // Preview
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        uploadLabel.textContent = file.name;
        const reader = new FileReader();
        reader.onload = function(evt) {
            fileBase64Data = evt.target.result;
            previewContainer.innerHTML = '';

            if (file.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = fileBase64Data;
                img.id = 'previewElement';
                img.className = 'max-h-full max-w-full object-contain transition-transform duration-200 rounded-lg';
                previewContainer.appendChild(img);
            } else if (file.type === 'application/pdf') {
                const iframe = document.createElement('iframe');
                iframe.src = fileBase64Data;
                iframe.id = 'previewElement';
                iframe.className = 'w-full h-full border-0 rounded-lg';
                previewContainer.appendChild(iframe);
            }

            fileStatusText.textContent = `جاهز للطباعة: ${file.name}`;
            fileSizeText.textContent = `${(file.size / (1024*1024)).toFixed(2)} MB`;
        };
        reader.readAsDataURL(file);
    });

    function zoomPreview(delta) {
        currentZoom = Math.max(0.5, Math.min(2, currentZoom + delta));
        const el = document.getElementById('previewElement');
        if (el) el.style.transform = `scale(${currentZoom})`;
        document.getElementById('zoomLevel').textContent = `${Math.round(currentZoom * 100)}%`;
    }

    // Fetch Printers
    async function fetchPrinters() {
        try {
            const response = await fetch('/api/printers');
            const data = await response.json();
            
            if (data.printers && data.printers.length > 0) {
                agentStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span class="text-emerald-600 dark:text-emerald-400 font-bold">الحاسوب متصل (نشط)</span>';
                agentStatus.className = "flex items-center gap-2 bg-emerald-50 dark:bg-emerald-950/40 px-3 py-1.5 rounded-full text-xs border border-emerald-200 dark:border-emerald-800";
                
                const currentVal = printerSelect.value;
                printerSelect.innerHTML = '';
                data.printers.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p;
                    opt.textContent = p;
                    if (p === currentVal) opt.selected = true;
                    printerSelect.appendChild(opt);
                });
                printerSelect.disabled = false;
                submitBtn.disabled = false;
            } else {
                agentStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500"></span><span class="text-amber-600 dark:text-amber-400 font-bold">بانتظار تشغيل agent.py</span>';
                printerSelect.innerHTML = '<option value="">-- الحاسوب المحلي غير متصل --</option>';
                printerSelect.disabled = true;
                submitBtn.disabled = true;
            }
        } catch (e) {
            agentStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span><span class="text-red-600 font-bold">خطأ في الاتصال</span>';
        }
    }

    fetchPrinters();
    setInterval(fetchPrinters, 4000);

    // Set Default Printer Action
    async function setDefaultPrinter() {
        const selectedPrinter = printerSelect.value;
        if (!selectedPrinter) {
            showAlert('الرجاء اختيار طابعة أولاً!', 'error');
            return;
        }

        try {
            const response = await fetch('/api/set-default-printer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ printerName: selectedPrinter })
            });
            
            if (response.ok) {
                showAlert(`تم تعيين الطابعة "${selectedPrinter}" كافتراضية بنجاح! 🖨️`, 'success');
            } else {
                showAlert('فشل تعيين الطابعة الافتراضية.', 'error');
            }
        } catch (e) {
            showAlert('خطأ في الاتصال بالسيرفر.', 'error');
        }
    }

    // Send Job
    async function sendPrintJob() {
        const file = fileInput.files[0];
        if (!file || !fileBase64Data) {
            showAlert('الرجاء اختيار ملف أولاً!', 'error');
            return;
        }

        showAlert('جاري إرسال المهمة للطباعة الصامتة...', 'success');
        submitBtn.disabled = true;

        const jobData = {
            printerName: printerSelect.value,
            fileName: file.name,
            fileUrl: fileBase64Data,
            copies: copiesInput.value,
            orientation: document.getElementById('orientationSelect').value,
            colorMode: document.getElementById('colorSelect').value,
            paperSize: document.getElementById('paperSize').value
        };

        try {
            const response = await fetch('/api/print', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(jobData)
            });

            if (response.ok) {
                showAlert('تم إرسال المهمة للطباعة في الخلفية بنجاح! 🖨️', 'success');
            } else {
                showAlert('حدث خطأ أثناء الإرسال.', 'error');
            }
        } catch (err) {
            showAlert('فشل الاتصال بالسيرفر السحابي.', 'error');
        } finally {
            submitBtn.disabled = false;
        }
    }

    function showAlert(msg, type) {
        alertBox.textContent = msg;
        alertBox.className = `mb-3 p-3 text-xs rounded-xl text-center font-semibold ${type === 'success' ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 border border-emerald-200' : 'bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 border border-red-200'}`;
        alertBox.classList.remove('hidden');
    }
</script>

</body>
</html>

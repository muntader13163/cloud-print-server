<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طباعة المستندات - Windows Print</title>
    <style>
        :root {
            --win-bg: #f0f0f0;
            --win-window-bg: #ffffff;
            --win-border: #adadad;
            --win-blue: #0078d7;
            --win-blue-hover: #106ebe;
            --win-text: #1e1e1e;
            --success: #107c41;
            --danger: #d13438;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--win-bg);
            color: var(--win-text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .print-dialog {
            background-color: var(--win-window-bg);
            border: 1px solid var(--win-border);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 4px;
        }

        .dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e1e1e1;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .dialog-header h3 {
            margin: 0;
            font-size: 1.1rem;
            color: #000;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .status-online { background-color: #dff6dd; color: var(--success); }
        .status-offline { background-color: #fde8e8; color: var(--danger); }

        .form-section {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
        }

        select, input[type="file"], input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--win-border);
            border-radius: 2px;
            box-sizing: border-box;
            font-size: 0.9rem;
            background: #fff;
        }

        select:focus, input:focus {
            border-color: var(--win-blue);
            outline: none;
        }

        .preview-box {
            background: #fafafa;
            border: 1px dashed var(--win-border);
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
        }

        .dialog-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            border-top: 1px solid #e1e1e1;
            padding-top: 15px;
        }

        .btn {
            padding: 6px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--win-border);
            border-radius: 2px;
            cursor: pointer;
        }

        .btn-print {
            background-color: var(--win-blue);
            color: white;
            border-color: var(--win-blue);
        }

        .btn-print:hover { background-color: var(--win-blue-hover); }
        .btn-print:disabled { background-color: #cccccc; border-color: #b0b0b0; cursor: not-allowed; }

        .alert {
            margin-top: 10px;
            padding: 8px;
            font-size: 0.85rem;
            border-radius: 2px;
            display: none;
        }
        .alert-success { background-color: #dff6dd; color: var(--success); }
        .alert-error { background-color: #fde8e8; color: var(--danger); }
    </style>
</head>
<body>

<div class="print-dialog">
    <div class="dialog-header">
        <h3>🖨️ طباعة (Print)</h3>
        <div id="agentStatus" class="status-badge status-offline">جاري الاتصال...</div>
    </div>

    <form id="printForm">
        <!-- 1. اختيار الطابعة تلقائياً -->
        <div class="form-section">
            <label for="printerSelect">الطابعة (Printer):</label>
            <select id="printerSelect" required disabled>
                <option value="">-- بانتظار اتصال الحاسوب المحلي --</option>
            </select>
        </div>

        <!-- 2. اختيار الملف -->
        <div class="form-section">
            <label for="fileInput">اختر المستند (PDF أو صورة):</label>
            <input type="file" id="fileInput" accept="application/pdf,image/*" required>
        </div>

        <!-- 3. عدد النسخ -->
        <div class="form-section">
            <label for="copiesInput">عدد النسخ (Copies):</label>
            <input type="number" id="copiesInput" value="1" min="1" max="99" required>
        </div>

        <div id="alertBox" class="alert"></div>

        <!-- الأزرار السفلية المشابهة لويندوز -->
        <div class="dialog-footer">
            <button type="submit" id="submitBtn" class="btn btn-print" disabled>طباعة</button>
        </div>
    </form>
</div>

<script>
    const agentStatus = document.getElementById('agentStatus');
    const printerSelect = document.getElementById('printerSelect');
    const fileInput = document.getElementById('fileInput');
    const copiesInput = document.getElementById('copiesInput');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');

    // جلب الطابعات المتصلة تلقائياً من الحاسوب المحلي كل 4 ثوانٍ
    async function fetchPrinters() {
        try {
            const response = await fetch('/api/printers');
            const data = await response.json();
            
            if (data.printers && data.printers.length > 0) {
                agentStatus.textContent = '● الحاسوب متصل';
                agentStatus.className = 'status-badge status-online';
                
                // حفظ الطابعة المختارة حالياً إن وجدت
                const currentSelected = printerSelect.value;

                // تحديث القائمة المنسدلة بالطابعات الحقيقية
                printerSelect.innerHTML = '';
                data.printers.forEach(printer => {
                    const option = document.createElement('option');
                    option.value = printer;
                    option.textContent = printer;
                    if (printer === currentSelected) option.selected = true;
                    printerSelect.appendChild(option);
                });

                printerSelect.disabled = false;
                submitBtn.disabled = false;
            } else {
                agentStatus.textContent = '○ بانتظار تشغيل agent.py';
                agentStatus.className = 'status-badge status-offline';
                printerSelect.innerHTML = '<option value="">-- الحاسوب المحلي غير متصل --</option>';
                printerSelect.disabled = true;
                submitBtn.disabled = true;
            }
        } catch (e) {
            agentStatus.textContent = '○ خطأ في الاتصال بالسيرفر';
            agentStatus.className = 'status-badge status-offline';
        }
    }

    fetchPrinters();
    setInterval(fetchPrinters, 4000);

    // إرسال مهمة الطباعة
    document.getElementById('printForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const file = fileInput.files[0];
        if (!file) return;

        showAlert('جاري معالجة الملف وإرساله للطابعة...', 'success');
        submitBtn.disabled = true;

        const reader = new FileReader();
        reader.onload = async function(evt) {
            const jobData = {
                printerName: printerSelect.value,
                fileName: file.name,
                fileUrl: evt.target.result,
                copies: copiesInput.value
            };

            try {
                const response = await fetch('/api/print', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jobData)
                });

                const result = await response.json();
                if (response.ok) {
                    showAlert('تم إرسال المهمة بنجاح، ستتم الطباعة الآن!', 'success');
                    fileInput.value = '';
                } else {
                    showAlert('حدث خطأ: ' + (result.message || 'غير معروف'), 'error');
                }
            } catch (err) {
                showAlert('فشل الاتصال: ' + err.message, 'error');
            } finally {
                submitBtn.disabled = false;
            }
        };

        reader.readAsDataURL(file);
    });

    function showAlert(msg, type) {
        alertBox.textContent = msg;
        alertBox.className = `alert alert-${type}`;
        alertBox.style.display = 'block';
    }
</script>

</body>
</html>
